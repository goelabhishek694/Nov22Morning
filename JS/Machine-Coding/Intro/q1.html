<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <select name="genre" id="movieGenre">
      <option value="all" selected>All Movies</option>
      <option value="Crime">Crime</option>
      <option value="Thriller">Thriller</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Comedy">Comedy</option>
      <option value="Romantic">Romantic</option>
    </select>

    <h1>Selected Movies</h1>
    <ul>

    </ul>
    <script>
      const movies = [
        {
          title: "Inception",
          director: "Christopher Nolan",
          releaseYear: 2010,
          genre: "Thriller",
          rating: 8.8,
        },
        {
          title: "The Shawshank Redemption",
          director: "Frank Darabont",
          releaseYear: 1994,
          genre: "Sci-Fi",
          rating: 9.3,
        },
        {
          title: "The Godfather",
          director: "Francis Ford Coppola",
          releaseYear: 1972,
          genre: "Crime",
          rating: 9.2,
        },
        {
          title: "The Dark Knight",
          director: "Christopher Nolan",
          releaseYear: 2008,
          genre: "Comedy",
          rating: 9.0,
        },
        {
          title: "Pulp Fiction",
          director: "Quentin Tarantino",
          releaseYear: 1994,
          genre: "Romantic",
          rating: 8.9,
        },
      ];

      const selectedGenre = document.querySelector("#movieGenre");
      selectedGenre.addEventListener("change",()=>{
          
          let genre =  selectedGenre.value;
          console.log(genre);
        filterMovies(genre)
      })

      function filterMovies(genre){
        if(genre=="all") display(movies);
        else{let filteredMovies = movies.filter(movieObj => movieObj.genre == genre);
        display(filteredMovies)}
      }

      function display(allMovies){
        
        const ul = document.querySelector("ul");
        ul.innerHTML="";
        for(let i=0;i<allMovies.length;i++){
            const li = document.createElement("li");
            li.innerText = allMovies[i].title;
            ul.appendChild(li);
        }
        
        
      }
    </script>
  </body>
</html>
