<!-- Ques -->
<!-- Use a single event handler(only one element should have an event handler attached to it) and do the following: -->
<!-- On clicking the color name change the background color of the div.container to the same. -->
<!DOCTYPE html>
<html lang = "en">

<head>
    <meta charset = "UTF - 8" />
    <meta http-equiv = "X - UA - Compatible" content = "IE = edge" />
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />
    <title>Event Delegation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            border: 1px solid;
            height: 10rem;
            width: 10rem;
        }
    </style>
</head>

<body>
    <div class = "container">
        <div class = "red abc">red</div>
        <div class = "blue">blue</div>
        <div class = "green">green</div>
    </div>
    <script>
        let container = document.querySelector(".container");
        
        //noob way to handle events 
        // let redDiv = document.querySelector(".red");
        // let blueDiv = document.querySelector(".blue");
        // let greenDiv = document.querySelector(".green");

        // redDiv.addEventListener("click",function(){
        //     container.style.backgroundColor = "red";
        // })

        // blueDiv.addEventListener("click",function(){
        //     container.style.backgroundColor = "blue";
        // })

        // greenDiv.addEventListener("click",function(){
        //     container.style.backgroundColor = "green";
        // })

        //pro way - use eventBubling
        container.addEventListener("click", function(e){
            // console.log("target ", e.target);
            // console.log("CurrentTarget ", e.currentTarget);

            let eleClick = e.target;
            // let color = eleClick.classList[0];
            let color = eleClick.getAttribute("class").split(" ")[0];
            // console.log(color);
            container.style.backgroundColor = color
        })

    </script>
</body>

</html>
