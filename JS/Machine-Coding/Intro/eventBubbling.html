<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outerbox{
            height: 10rem;
            width: 10rem;
            background-color: lightblue;
        }

        .innerbox{
            height: 50%;
            width: 50%;
            background-color: rgb(210, 14, 191);
        }
        #button{
            margin-top: 3px;
            background-color: salmon;
            width: 50%;
            margin-left: 3px;
        }
    </style>
</head>
<body>
    <h3>Event Bubbling</h3>
    <div class="outerbox">
        <div class="innerbox">
            <div id="button">
                Send
            </div>
        </div>
    </div>
    <script>
        const outerBox = document.querySelector(".outerbox");
        const innerBox = document.querySelector(".innerbox");
        const btn = document.querySelector("#button");

        btn.addEventListener("click",function(e){
            console.log("btn was clicked");
            console.log("target ", e.target);
            console.log("CurrentTarget ", e.currentTarget);
            
        })

        innerBox.addEventListener("click",function(e){
            console.log("innerBox was clicked");
            // eventObj.stopPropagation(); // stops propogation of event for all the ancestor elements
            // eventObj.stopImmediatePropagation();// stops propogation of event for all the ancestor elements and current ele
            console.log("target ", e.target); // the node on which event originally occured
            console.log("CurrentTarget ", e.currentTarget); // the node on which currently event ocurred

        })

        // innerBox.addEventListener("click",function(eventObj){
        //     console.log("innerBox was clicked handler 2");
        // })

        outerBox.addEventListener("click",function(e){
            console.log("outerBox was clicked");
            console.log("target ", e.target);
            console.log("CurrentTarget ", e.currentTarget);
        })

        document.addEventListener("click",function(e){
            console.log("document was clicked");
            console.log("target ", e.target);
            console.log("CurrentTarget ", e.currentTarget);
        })
    </script>
</body>
</html>
